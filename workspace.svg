<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Web developer working at a desk, seen from behind">
  <rect width="800" height="600" fill="#12081a"/>
  <circle cx="640" cy="100" r="170" fill="#4c1d95" opacity="0.45"/>
  <circle cx="130" cy="500" r="150" fill="#7e22ce" opacity="0.25"/>

  <!-- wall shelf -->
  <rect x="80" y="90" width="220" height="14" rx="7" fill="#4a2560"/>
  <rect x="110" y="52" width="34" height="40" rx="4" fill="#a855f7"/>
  <rect x="152" y="62" width="34" height="30" rx="4" fill="#f59e0b"/>
  <rect x="194" y="46" width="60" height="46" rx="6" fill="#241233" stroke="#4a2560" stroke-width="3"/>

  <!-- main monitor -->
  <rect x="240" y="130" width="320" height="220" rx="14" fill="#241233" stroke="#a855f7" stroke-width="4"/>
  <rect x="256" y="146" width="288" height="188" rx="6" fill="#12081a"/>
  <!-- website mockup on screen -->
  <rect x="272" y="162" width="110" height="14" rx="7" fill="#a855f7"/>
  <rect x="272" y="186" width="200" height="60" rx="8" fill="#4c1d95"/>
  <rect x="284" y="200" width="120" height="10" rx="5" fill="#f5efff" opacity="0.85"/>
  <rect x="284" y="218" width="80" height="16" rx="8" fill="#f59e0b"/>
  <rect x="486" y="186" width="42" height="60" rx="8" fill="#7e22ce"/>
  <rect x="272" y="258" width="90" height="56" rx="8" fill="#241233" stroke="#4a2560" stroke-width="3"/>
  <rect x="372" y="258" width="90" height="56" rx="8" fill="#241233" stroke="#4a2560" stroke-width="3"/>
  <rect x="472" y="258" width="56" height="56" rx="8" fill="#22c55e" opacity="0.85"/>
  <rect x="386" y="326" width="28" height="8" rx="4" fill="#4a2560"/>

  <!-- monitor stand -->
  <rect x="384" y="350" width="32" height="46" fill="#241233"/>
  <rect x="348" y="392" width="104" height="12" rx="6" fill="#241233"/>

  <!-- desk -->
  <rect x="90" y="430" width="620" height="26" rx="8" fill="#4a2560"/>
  <rect x="140" y="456" width="24" height="100" fill="#241233"/>
  <rect x="636" y="456" width="24" height="100" fill="#241233"/>

  <!-- keyboard + mouse -->
  <rect x="320" y="436" width="160" height="14" rx="7" fill="#1c0d26" stroke="#4a2560" stroke-width="2"/>
  <circle cx="520" cy="443" r="10" fill="#1c0d26" stroke="#4a2560" stroke-width="2"/>

  <!-- chair back -->
  <rect x="330" y="400" width="140" height="120" rx="24" fill="#3b1470"/>

  <!-- person from behind (no face) -->
  <!-- torso / hoodie -->
  <path d="M330 560 L340 460 Q400 430 460 460 L470 560 Z" fill="#6d28d9"/>
  <path d="M340 460 Q400 430 460 460 L456 486 Q400 460 344 486 Z" fill="#5b21b6"/>
  <!-- neck + back of head -->
  <rect x="384" y="356" width="32" height="34" rx="10" fill="#3b2a55"/>
  <circle cx="400" cy="330" r="46" fill="#221335"/>
  <path d="M356 322 Q360 280 400 278 Q440 280 444 322 Q446 348 438 366 L434 340 Q420 312 400 312 Q380 312 366 340 L362 366 Q354 348 356 322 Z" fill="#160b26"/>
  <!-- arms to keyboard -->
  <path d="M336 480 L300 440 L316 428 L352 466 Z" fill="#6d28d9"/>
  <path d="M464 480 L500 440 L484 428 L448 466 Z" fill="#6d28d9"/>
  <circle cx="306" cy="438" r="12" fill="#3b2a55"/>
  <circle cx="494" cy="438" r="12" fill="#3b2a55"/>

  <!-- coffee -->
  <rect x="596" y="376" width="50" height="56" rx="8" fill="#f59e0b"/>
  <rect x="596" y="376" width="50" height="15" rx="7" fill="#b45309"/>
  <path d="M646 388 h12 a9 9 0 0 1 0 24 h-12" fill="none" stroke="#f59e0b" stroke-width="7"/>

  <!-- plant -->
  <rect x="120" y="372" width="54" height="60" rx="8" fill="#7e22ce"/>
  <path d="M147 372 q-38 -28 -50 -66 M147 372 q0 -42 10 -74 M147 372 q38 -28 50 -66" stroke="#22c55e" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- floating tags -->
  <g font-family="monospace" font-size="32" font-weight="bold">
    <text x="92" y="220" fill="#a855f7" opacity="0.9">&lt;/&gt;</text>
    <text x="648" y="260" fill="#f59e0b" opacity="0.9">{ }</text>
  </g>
</svg>
